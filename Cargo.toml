[package]
name = "agent-dungeon"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
description = "Terminal-first agent environments with OpenShell and optional Telltale"
repository = "https://github.com/Dark-Roast-Cyber/dungeon"
rust-version = "1.82"

[[bin]]
name = "dungeon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
