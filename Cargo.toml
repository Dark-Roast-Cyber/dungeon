[package]
name = "agent-dungeon"
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"
description = "Terminal-first agent environments with OpenShell and optional Telltale"
repository = "https://github.com/Dark-Roast-Cyber/dungeon"
rust-version = "1.98.1"

[[bin]]
name = "dungeon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
