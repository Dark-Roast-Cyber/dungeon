name: Bug
description: Report a defect with a sanitized reproduction
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, session stores, private project contents, or vulnerability details. Report security issues through SECURITY.md.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Dungeon commit or version, OpenShell version, and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
