name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: dungeon --version
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  release:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Publish immutable engineering preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          VERSION=$(python -c 'from dungeon import __version__; print(__version__)')
          SUBJECT=$(printf '%s\n' "$RELEASE_MESSAGE" | head -n 1)
          test "$SUBJECT" = "release: v$VERSION"
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Dungeon $VERSION engineering preview" --notes-file CHANGELOG.md
