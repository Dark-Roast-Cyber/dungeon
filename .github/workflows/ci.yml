name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: node --test npm/launcher/test/platform.test.mjs
      - run: npm pack --dry-run ./npm/launcher
      - name: Check package versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cargo = fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (!cargo) throw new Error('Cargo version not found');
          for (const file of [
            'npm/launcher/package.json',
            'npm/platform/linux-x64/package.json',
            'npm/platform/darwin-arm64/package.json',
            'npm/platform/darwin-x64/package.json',
            'npm/platform/win32-x64/package.json'
          ]) {
            const version = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (version !== cargo) throw new Error(`${file}: ${version} != ${cargo}`);
          }
          NODE

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
      - run: cargo test
      - run: cargo build --release
      - run: target/release/dungeon --version
        if: runner.os != 'Windows'
      - run: target\release\dungeon.exe --version
        if: runner.os == 'Windows'
