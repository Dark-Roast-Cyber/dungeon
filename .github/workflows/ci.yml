name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  npm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test npm/launcher/test/platform.test.mjs
      - run: npm pack --dry-run ./npm/launcher
      - name: Check package versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cargo = fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (!cargo) throw new Error('Cargo version not found');
          for (const file of [
            'npm/launcher/package.json',
            'npm/platform/linux-x64/package.json',
            'npm/platform/darwin-arm64/package.json',
            'npm/platform/darwin-x64/package.json',
            'npm/platform/win32-x64/package.json'
          ]) {
            const version = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (version !== cargo) throw new Error(`${file}: ${version} != ${cargo}`);
          }
          NODE

  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: linux-x64
            archive: tar
          - os: macos-26
            target: darwin-arm64
            archive: tar
          - os: macos-26-intel
            target: darwin-x64
            archive: tar
          - os: windows-2025
            target: win32-x64
            archive: zip
    name: native-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo build --release --locked
      - run: target/release/dungeon --version
        if: runner.os != 'Windows'
      - run: target\release\dungeon.exe --version
        if: runner.os == 'Windows'
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p dist/package
          cp target/release/dungeon LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/dungeon-${version}-${{ matrix.target }}.tar.gz" dungeon LICENSE README.md
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/dungeon.exe,LICENSE,README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/dungeon-$version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/dungeon-*
          if-no-files-found: error
          retention-days: 7
