name: Publish native release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Verify tag version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: linux-x64
            archive: tar
          - os: macos-26
            target: darwin-arm64
            archive: tar
          - os: macos-26-intel
            target: darwin-x64
            archive: tar
          - os: windows-2025
            target: win32-x64
            archive: zip
    name: release-build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: cargo build --release --locked
      - run: target/release/dungeon --version
        if: runner.os != 'Windows'
      - run: target\release\dungeon.exe --version
        if: runner.os == 'Windows'
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/package
          cp target/release/dungeon LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/dungeon-${version}-${{ matrix.target }}.tar.gz" dungeon LICENSE README.md
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/dungeon.exe,LICENSE,README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/dungeon-$version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/dungeon-*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive_count="$(find . -maxdepth 1 -type f \( -name 'dungeon-*.tar.gz' -o -name 'dungeon-*.zip' \) | wc -l)"
          test "$archive_count" -eq 4
          sha256sum dungeon-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Dungeon ${GITHUB_REF_NAME#v} engineering preview"
